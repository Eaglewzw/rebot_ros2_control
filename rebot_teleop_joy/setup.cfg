[develop]
script_dir=$base/lib/rebot_teleop_joy
[install]
install_scripts=$base/lib/rebot_teleop_joy

[tool:pytest]
# A user-site anyio ships a pytest plugin that is incompatible with the
# system pytest on Humble/Jammy and aborts collection; the tests here need
# no async plugin, so block it.
addopts = -p no:anyio
