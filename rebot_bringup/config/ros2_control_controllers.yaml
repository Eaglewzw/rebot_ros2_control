# ==============================================================================
# reBot ros2_control controllers config (Mock mode)
#
# - controller_manager.ros__parameters      → type for each controller
# - <controller_name>.ros__parameters       → runtime params for each controller
#
# Both sections MUST have ros__parameters for the ROS2 param-file parser.
# ==============================================================================

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/JointGroupPositionController

# ==============================================================================

joint_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    use_local_topics: false

# ==============================================================================

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position
      - velocity

    state_interfaces:
      - position
      - velocity

    state_publish_rate:   50.0
    action_monitor_rate:  20.0

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

    gains:
      joint1: { p: 100.0,  i: 0.0,  d: 5.0,   i_clamp: 10.0,  ff_velocity: 1.0 }
      joint2: { p: 200.0,  i: 0.0,  d: 10.0,  i_clamp: 10.0,  ff_velocity: 1.0 }
      joint3: { p: 150.0,  i: 0.0,  d: 8.0,   i_clamp: 10.0,  ff_velocity: 1.0 }
      joint4: { p: 100.0,  i: 0.0,  d: 5.0,   i_clamp: 5.0,   ff_velocity: 1.0 }
      joint5: { p: 80.0,   i: 0.0,  d: 4.0,   i_clamp: 5.0,   ff_velocity: 1.0 }
      joint6: { p: 80.0,   i: 0.0,  d: 4.0,   i_clamp: 5.0,   ff_velocity: 1.0 }

# ==============================================================================

gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint
